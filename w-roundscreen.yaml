    #        args: [ 'x' ]
  
    



touchscreen:
  platform: cst816
  id: touch_1
  display: display_1
  interrupt_pin: $intpin
  reset_pin: $rstpin
  transform:
    #mirror_x: false
    mirror_y: true
    #swap_xy: false
#  on_touch:
#    - lambda: |-
#          ESP_LOGI("touch", "x=%d, y=%d, x_raw=%d, y_raw=%0d",
#              touch.x,
#              touch.y,
#              touch.x_raw,
#              touch.y_raw
#              );
  on_release:
      - if:
          condition: lvgl.is_paused
          then:
            - logger.log: "LVGL resuming"
            - lvgl.resume:
            - lvgl.widget.redraw:
            - light.turn_on: back_light

number:
  - platform: template
    name: LVGL Screen timeout
    optimistic: true
    id: display_timeout
    unit_of_measurement: "s"
    initial_value: 45
    restore_value: true
    min_value: 10
    max_value: 180
    step: 5
    mode: box

