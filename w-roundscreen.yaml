lvgl:
    displays:
      - display_1
    touchscreens:
      - touch_1     
    on_idle:
      timeout: !lambda "return (id(display_timeout).state * 1000);"
      then:
        - logger.log: "LVGL is idle"
        - light.turn_off: back_light
        - lvgl.pause:
    pages:
      - id: meter_page
        bg_color: 0x000
        widgets: 
          #Wrapper object that works as a size restrictor
          - obj: 
              width: 50%
              height: 50%
              #x: 25%
              #y: 25%
              bg_color: 0x000000
              pad_all: 0
              border_width: 0
              #border_color: 0xfff
              widgets:

                # Icon (Center)
                - label:
                    id: icon_label
                    #type: label
                    text: "\uF015"
                    align: BOTTOM_RIGHT
                    x: -2
                    y: -15
                    text_font: montserrat_32
                    text_color: 0xffffff

                # Indoor Hum Label (Top Center)
                - label:
                    id: room_label
                    #type: label
                    text: "Living Room"
                    align: BOTTOM_RIGHT
                    y: -2
                    x: -2
                    text_font: montserrat_12
                    text_color: 0xffffff

                # Indoor Temperature Arc (Top Left)
                - arc:
                    id: indoor_temp_arc
                    #type: arc
                    width: 60
