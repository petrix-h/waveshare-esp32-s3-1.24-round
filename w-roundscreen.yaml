
substitutions:
  devicename: round-touchscreen
  friendname: Round Touchscreen esp32
# Change the timezone to suit your location, or even just remove it - it will likely be picked up automatically
  timez: Europe/Helsinki
#  board: esp32-s3-devkitc-1
# Display state on initial start
# Note that the screensaver only starts after the first touch of the display
# Change to ALWAYS_OFF if want the screen to be off after booting, ALWAYS_ON if want it on at start eg for initial troubleshooting
  screenstart: ALWAYS_ON
# Timeout for the screen
  screensaver: 5 min
#GPIO pins for the LCD screen
  repin: GPIO14
  dcpin: GPIO8
# Note - you may see an error on compilation "WARNING GPIO2 is a Strapping PIN and should be avoided" - ignore this as you have no choice
# This error message may be removed via the "ignore_strapping_warning" option for the screen driver
  bkpin: GPIO2 # was 2 two
  clpin: GPIO10
  mopin: GPIO11
  mipin: GPIO12
  cspin: GPIO09
# GPIO pins for the touch screen
  sdapin: GPIO6
  sclpin: GPIO7
  intpin: GPIO5  
  rstpin: GPIO13

#BT Proxy and beacon
# Hmm, look into this maybe? https://github.com/rpatel3001/BleDistance/blob/master/example_configuration.yaml
#bluetooth_proxy:
#  active: false

#esp32_ble_tracker:
#  scan_parameters:
    #interval: 1100ms
    #window: 1100ms
#    duration: 60s
#    active: false

spi:
  mosi_pin: $mopin
  clk_pin: $clpin
  miso_pin: $mipin
# Don't use software - makes it crawl  
#  force_sw: True
#mosi = Master Out Slave In
#miso = Master In Slave Out or fermented bean paste. In this case, most likely the former rather than the latter. Doesn't matter as not used.

i2c:
  - id: bus_internal
    sda: $sdapin
    scl: $sclpin
    #Following helped someone get rid of the "Components should block" error messages but didn't for me
    #frequency: 400kHz
  #- id: bus_external # external bus for assist? 
  #  sda: GPIOxx
  #  scl: GPIOxx
  #  scan: true

# Define a PWM output on the ESP32
output:
  - platform: ledc
    pin: $bkpin
    id: backlight_pwm

# Define a monochromatic, dimmable light for the backlight
light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Display Backlight"
    id: back_light
    restore_mode: ALWAYS_ON
    on_state:
      - lvgl.widget.update:
          id: light_switch
          state:
            checked: !lambda return !id(back_light).current_values.is_on();


# Optional: Add a simple display test
text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"

display:
  - platform: ili9xxx
    model: GC9A01A #ST7789V
    dc_pin: $dcpin
    reset_pin: $repin
    cs_pin: $cspin
    invert_colors: true
    show_test_card: false
    auto_clear_enabled: false
    dimensions: 
      height: 240
      width: 240
    rotation: 180 #0 # if changed touch screen will get messed up as it doesn't rotate
    color_order: BGR
    id: display_1

sensor:
  - platform: internal_temperature
    name: "Internal Temperature"
  #- platform: homeassistant
  #  entity_id: sensor.w_roundscreen_internal_temperature
  #  id: intake_temperature
    #on_value:
    #  - lvgl.indicator.update:
    #      id: temperature_needle2
    #      value: !lambda return x * 10;
    #  - lvgl.label.update:
    #      id: temperature_text2
    #      text:
    #        format: "%.1f°C"
    #        args: [ 'x' ]
  
    



touchscreen:
  platform: cst816
  id: touch_1
  display: display_1
  interrupt_pin: $intpin
  reset_pin: $rstpin
  transform:
    #mirror_x: false
    mirror_y: true
    #swap_xy: false
#  on_touch:
#    - lambda: |-
#          ESP_LOGI("touch", "x=%d, y=%d, x_raw=%d, y_raw=%0d",
#              touch.x,
#              touch.y,
#              touch.x_raw,
#              touch.y_raw
#              );
  on_release:
      - if:
          condition: lvgl.is_paused
          then:
            - logger.log: "LVGL resuming"
            - lvgl.resume:
            - lvgl.widget.redraw:
            - light.turn_on: back_light

number:
  - platform: template
    name: LVGL Screen timeout
    optimistic: true
    id: display_timeout
    unit_of_measurement: "s"
    initial_value: 45
    restore_value: true
    min_value: 10
    max_value: 180
    step: 5
    mode: box

#font:
#  - file: "fonts/materialdesignicons-webfont.ttf"
#    id: mdi_42
#    size: 42
#    bpp: 4
#    glyphs: [
#      "\U000F0335", # mdi-lightbulb
#      "\U000F0336", # mdi-lightbulb-outline
#      ]

binary_sensor:
  - platform: homeassistant
    id: remote_light
    entity_id: light.ikea_of_sweden_tradfri_bulb_e27_cws_opal_600lm
    publish_initial_state: true
    on_state:
      then:
        lvgl.widget.update:
          id: light_btn
          state:
            checked: !lambda return x;

lvgl:
    displays:
      - display_1
    touchscreens:
      - touch_1     
    on_idle:
      timeout: !lambda "return (id(display_timeout).state * 1000);"
      then:
        - logger.log: "LVGL is idle"
        - light.turn_off: back_light
        - lvgl.pause:
    pages:
      - id: meter_page
        bg_color: 0x000000
        widgets:
          - switch:
              align: CENTER
              y: -100
              id: light_switch
              on_click:
                light.toggle: back_light
          - switch:
              align: CENTER
              y: 0
              id: light_switch3
              on_click:
                - homeassistant.action:
                    action: light.toggle
                    data:
                      entity_id: light.remote_light
          - button:
              id: light_btn
              align: CENTER
              width: 100
              height: 70
              y: 70
              checkable: true
              widgets:
                - label:
                    align: CENTER
                    text: 'Remote light'
              on_click:
                - logger.log: "Remote Light click"
                - homeassistant.action:
                    action: light.toggle
                    data:
                      entity_id: light.ikea_of_sweden_tradfri_bulb_e27_cws_opal_600lm
          - arc:
              x: 20
              y: 100
              id: arc_id
              value: 21
              min_value: 15
              max_value: 30
              height: 50
              width: 50 
              end_angle: 90 #180 #Default 45
              rotation: 0.0 #Default 0.0
              start_angle: 0 #Default 135
        