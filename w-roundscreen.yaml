
substitutions:
  devicename: round-touchscreen
  friendname: Round Touchscreen esp32
# Change the timezone to suit your location, or even just remove it - it will likely be picked up automatically
  timez: Europe/Helsinki
#  board: esp32-s3-devkitc-1
# Display state on initial start
# Note that the screensaver only starts after the first touch of the display
# Change to ALWAYS_OFF if want the screen to be off after booting, ALWAYS_ON if want it on at start eg for initial troubleshooting
  screenstart: ALWAYS_ON
# Timeout for the screen
  screensaver: 5 min
#GPIO pins for the LCD screen
  repin: GPIO14
  dcpin: GPIO8
# Note - you may see an error on compilation "WARNING GPIO2 is a Strapping PIN and should be avoided" - ignore this as you have no choice
# This error message may be removed via the "ignore_strapping_warning" option for the screen driver
  bkpin: GPIO2 # was 2 two
  clpin: GPIO10
  mopin: GPIO11
  mipin: GPIO12
  cspin: GPIO09
# GPIO pins for the touch screen
  sdapin: GPIO6
  sclpin: GPIO7
  intpin: GPIO5  
  rstpin: GPIO13

#BT Proxy and beacon
# Hmm, look into this maybe? https://github.com/rpatel3001/BleDistance/blob/master/example_configuration.yaml
#bluetooth_proxy:
#  active: false

#esp32_ble_tracker:
#  scan_parameters:
    #interval: 1100ms
    #window: 1100ms
#    duration: 60s
#    active: false

spi:
  mosi_pin: $mopin
  clk_pin: $clpin
  miso_pin: $mipin
# Don't use software - makes it crawl  
#  force_sw: True
#mosi = Master Out Slave In
#miso = Master In Slave Out or fermented bean paste. In this case, most likely the former rather than the latter. Doesn't matter as not used.

i2c:
  sda: $sdapin
  scl: $sclpin
  #Following helped someone get rid of the "Components should block" error messages but didn't for me
  #frequency: 400kHz

# Define a PWM output on the ESP32
output:
  - platform: ledc
    pin: $bkpin
    id: backlight_pwm

# Define a monochromatic, dimmable light for the backlight
light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Display Backlight"
    id: back_light
    restore_mode: ALWAYS_ON

# Optional: Add a simple display test
text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"

display:
  - platform: ili9xxx
    model: GC9A01A #ST7789V
    dc_pin: $dcpin
    reset_pin: $repin
    cs_pin: $cspin
    invert_colors: true
    show_test_card: false
    auto_clear_enabled: false
    dimensions: 
      height: 240
      width: 240
    rotation: 0
    color_order: BGR
    id: display_1

# lvgl:
#     pages:
#       - id: main_page
#         widgets:
#           - switch:
#               align: CENTER
#               id: light_switch
#               #on_click:
#               #  light.toggle: local_light

sensor:
  - platform: homeassistant
    entity_id: sensor.temperature_humidity_sensor_e303_temperature
    id: intake_temperature
    on_value:
      - lvgl.indicator.update:
          id: temperature_needle2
          value: !lambda return x * 10;
      - lvgl.label.update:
          id: temperature_text2
          text:
            format: "%.1f°C"
            args: [ 'x' ]
  
    
  - platform: internal_temperature
    name: "Internal Temperature"


touchscreen:
  platform: cst816
  id: touch_1
  display: display_1
  interrupt_pin: $intpin
  reset_pin: $rstpin
  on_touch:
    - lambda: |-
          ESP_LOGI("touch", "x=%d, y=%d, x_raw=%d, y_raw=%0d",
              touch.x,
              touch.y,
              touch.x_raw,
              touch.y_raw
              );
  on_release:
      - if:
          condition: lvgl.is_paused
          then:
            - logger.log: "LVGL resuming"
            - lvgl.resume:
            - lvgl.widget.redraw:
            - light.turn_on: back_light

number:
  - platform: template
    name: LVGL Screen timeout
    optimistic: true
    id: display_timeout
    unit_of_measurement: "s"
    initial_value: 45
    restore_value: true
    min_value: 10
    max_value: 180
    step: 5
    mode: box

lvgl:
    displays:
      - display_1
    touchscreens:
      - touch_1     
    on_idle:
      timeout: !lambda "return (id(display_timeout).state * 1000);"
      then:
        - logger.log: "LVGL is idle"
        - light.turn_off: back_light
        - lvgl.pause:
    pages:
      - id: meter_page
        bg_color: 0x000000
        widgets:
          - obj:
              height: 50
              width: 50
              align: CENTER
              y: -18
              bg_color: 0xFFFFFF
              border_width: 0
              pad_all: 14
              widgets:
                - meter:
                    height: 100%
                    width: 100%
                    border_width: 0
                    align: CENTER
                    bg_opa: TRANSP
                    scales:
                      - range_from: -15
                        range_to: 35
                        angle_range: 180
                        ticks:
                          count: 70
                          width: 1
                          length: 31
                        indicators:
                          - tick_style:
                              start_value: -15
                              end_value: 35
                              color_start: 0x3399ff
                              color_end: 0xffcc66
                      - range_from: -150
                        range_to: 350
                        angle_range: 180
                        ticks:
                          count: 0
                        indicators:
                          - line:
                              id: temperature_needle2
                              width: 8
                              r_mod: 2
                              value: -150
                - obj: # to cover the middle part of meter indicator line
                    height: 123
                    width: 123
                    radius: 73
                    align: CENTER
                    border_width: 0
                    pad_all: 0
                    bg_color: 0xFFFFFF
                - label:
                    id: temperature_text2
                    text: "--.-°C"
                    align: CENTER
                    y: -26
                - label:
                    text: "Intake"
                    align: CENTER
                    y: -6
